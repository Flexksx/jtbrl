pre-commit:
  commands:
    format-nix:
      glob: "**/*.nix"
      run: alejandra {staged_files}
      stage_fixed: true
    lint-markdown:
      glob: "**/*.md"
      run: rumdl check --fix {staged_files}
      stage_fixed: true

